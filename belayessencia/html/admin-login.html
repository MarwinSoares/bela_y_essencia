<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bela Y Essência | Administração</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cardo:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/auth.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js" defer></script>
  <script src="../script/auth.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <header class="auth-header" aria-label="Cabeçalho principal">
      <a class="brand-link" href="index.html" aria-label="Bela Y Essência - início">
        <img src="../imagens/Logo.png" alt="Bela Y Essência">
      </a>
      <nav class="auth-nav" aria-label="Navegação principal">
        <a href="index.html">Site</a>
        <a href="login.html">Área da cliente</a>
      </nav>
    </header>

    <main class="auth-main">
      <section class="auth-layout" aria-labelledby="admin-login-title">
        <div class="auth-visual">
          <img src="../imagens/auth-background.png" alt="Sala de estética elegante com maca, toalhas rosé e detalhes dourados">
          <div class="auth-visual-copy">
            <p class="eyebrow">Administração</p>
            <h1 id="admin-login-title">Gestão da agenda.</h1>
            <p>Acesse a área da estética para acompanhar, reorganizar e cancelar horários agendados.</p>
          </div>
        </div>

        <div class="auth-panel">
          <p class="eyebrow">Login administrativo</p>
          <h2>Entre como admin</h2>
          <p class="panel-note">Use uma conta cadastrada como administradora.</p>

          <form class="auth-form" action="../../processos/admin_login.php" method="post" data-auth-form="admin-login">
            <div class="field-group">
              <label for="email">E-mail</label>
              <input id="email" name="email" class="field-control" type="email" autocomplete="email" placeholder="admin@belayessencia.com" required>
            </div>

            <div class="field-group">
              <label for="password">Senha</label>
              <div class="password-wrap">
                <input id="password" name="password" class="field-control" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
                <button class="icon-button password-toggle" type="button" aria-label="Mostrar senha" data-toggle-password>
                  <i data-lucide="eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <p class="form-status" data-form-status aria-live="polite"></p>

            <button class="primary-action" type="submit">
              <span>Entrar no painel</span>
              <i data-lucide="arrow-right" aria-hidden="true"></i>
            </button>
          </form>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
